spring.application.name=lscts
spring.datasource.url=jdbc:mysql://localhost:3306/lscts?allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.jwt.secret=${JWT_SECRET}
spring.jpa.open-in-view=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${LSTS_MAIL_USERNAME}
spring.mail.password=${LSTS_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.security=DEBUG
app.mail.from=${LSTS_MAIL_USERNAME}
app.frontend-base-url=http://localhost:5173
app.cors.allowed-origin=http://localhost:5173

server.error.include-message=always
server.error.include-exception=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate=INFO